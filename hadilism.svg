<?xml version="1.0" encoding="UTF-8"?>
<svg fill="none" viewBox="0 0 1500 650" xmlns="http://www.w3.org/2000/svg">
<foreignObject width="100%" height="100%">
<div xmlns="http://www.w3.org/1999/xhtml">
<style>.byReeven {
                font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji';
                display: flex; 
                flex-direction: column;
                align-items: center;
                justify-content: center;
                margin: 0;
                text-align: center;
                height: 100px;
                background-size: 200% 200%;
            }

            .byReevenContainer {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                border-radius: 10px;
                width: 100%;
                background: #333;
                padding-top: 100px;
                padding-bottom: 0; /* Adjusted padding-bottom to remove extra space */
                margin: 0; /* Removed any external margin to eliminate bottom space */
            }

            h1 {
                text-align: center;
                color: #fff;
                font-size: 5em;
                letter-spacing: 8px;
                font-family: "Lucida Console", Monaco, monospace;
                font-weight: 400;
                margin: 0; /* Ensure no extra margin */
                line-height: 0; /* Adjust line-height */
                animation: glitch1 2.5s infinite;
            }

            h1:nth-child(2) {
                color: #67f3da;
                animation: glitch2 2.5s infinite;
            }

            h1:nth-child(3) {
                color: #f16f6f;
                animation: glitch3 2.5s infinite;
            }

            @keyframes glitch1 { ... } /* Keyframes remain unchanged */
            @keyframes glitch2 { ... }
            @keyframes glitch3 { ... }
</style>
<div class="byReevenContainer">

<div class="byReeven">
<h1>Hey, I'm</h1>
<h1>Hey, I'm</h1>
<h1>Hey, I'm</h1>
</div>
<div class="byReeven">
<h1>ZekhnineBachir!</h1>
<h1>ZekhnineBachir!</h1>
<h1>ZekhnineBachir!</h1>
</div>
</div>
</div>
</foreignObject>
</svg>
